; JewCal for the GeekMagic SmallTV Ultra (ESP8266). Two images:
;   env:jewcal     the firmware: Arduino C++ (src/) + the Rust core (core/)
;   env:installer  a small image that fits through the stock firmware's
;                  updater and installs the full one (src/loader/)
; Build both with `make ultra` from the repo root, or `pio run` here.

[platformio]
default_envs = jewcal, installer

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
; 4 MB flash with a 1 MB filesystem (unused): the sketch area keeps room for
; a second copy, so /update can take the full image.
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:jewcal]
extra_scripts =
	${env.extra_scripts}
	pre:scripts/rust_core.py
build_src_filter = +<*> -<loader/>
build_flags =
	${env.build_flags}
	; Byte reads from flash: the Rust core's constants (fonts, sprites, time
	; zones, strings) stay there instead of in the 80 KB of RAM.
	-D NON32XFER_HANDLER
	; The loop stack stays at the core's 4 KB: it is carved out of the SDK's
	; system stack, and anything larger pushes that stack into RAM the ROM uses
	; (0x3FFFE000 down). Large buffers are static and the Rust frames are kept
	; small instead; the heap/stack log shows the low-water mark.
	-Wl,-Map,.pio/build/jewcal/firmware.map

[env:installer]
build_src_filter = +<loader/> +<display.cpp>
