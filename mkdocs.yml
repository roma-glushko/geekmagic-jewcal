site_name: JewCal
site_description: A pixel-art Jewish calendar for the GeekMagic SmallTV Pro and Ultra
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://geekmagic-jewcal.readthedocs.io/"]
repo_url: https://github.com/roma-glushko/geekmagic-jewcal
repo_name: roma-glushko/geekmagic-jewcal
edit_uri: edit/main/docs/
copyright: >-
  Made with <span class="jc-heart" role="img" aria-label="love"></span> by
  <a href="https://github.com/roma-glushko">Roman Hlushko</a>.
  Calendar data from Hebcal.com and weather from Open-Meteo.com (both CC BY 4.0).

exclude_docs: |
  requirements.txt
  assets/smalltv-6x.png

nav:
  - Overview: index.md
  - Install:
      - SmallTV Ultra: install-ultra.md
      - SmallTV Pro: install-pro.md
  - The screens: screens.md
  - Settings: settings.md
  - Troubleshooting: troubleshooting.md
  - Releases: https://github.com/roma-glushko/geekmagic-jewcal/releases

# The device's look: one dark scheme in its palette, its pixel font and
# candles (docs/stylesheets/extra.css, docs/assets).
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.top
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
